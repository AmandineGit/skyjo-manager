<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Skyjo</title>
  <link rel="stylesheet" href="/skyjo/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-icon">🎯</div>
      <h1>Créer un compte</h1>
      <p style="color: #666; margin-bottom: 30px;">Rejoignez Skyjo Manager</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash-message flash-error">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="login-form">
        <div class="form-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            class="login-input"
            placeholder="votre@email.com"
            autofocus
            required
          >
        </div>
        <div class="form-group">
          <label for="display_name">Nom d'affichage</label>
          <input
            type="text"
            id="display_name"
            name="display_name"
            class="login-input"
            placeholder="Comment vous appeler ?"
          >
        </div>
        <div class="form-group">
          <label for="password">Mot de passe *</label>
          <input
            type="password"
            id="password"
            name="password"
            class="login-input"
            placeholder="6 caractères minimum"
            required
            minlength="6"
          >
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmer le mot de passe *</label>
          <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            class="login-input"
            placeholder="Retapez votre mot de passe"
            required
          >
        </div>
        <button type="submit" class="button button-submit login-submit">Créer mon compte</button>
      </form>

      <div class="login-links">
        <a href="/skyjo/login">Déjà un compte ? Se connecter</a>
      </div>
    </div>
  </div>
</body>
</html>
