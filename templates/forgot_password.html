<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Skyjo</title>
  <link rel="stylesheet" href="/skyjo/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-icon">🔑</div>
      <h1>Mot de passe oublié</h1>
      <p style="color: #666; margin-bottom: 30px;">Entrez votre email pour réinitialiser votre mot de passe</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="login-input"
            placeholder="votre@email.com"
            autofocus
            required
          >
        </div>
        <button type="submit" class="button button-submit login-submit">Envoyer le lien</button>
      </form>

      <div class="login-links">
        <a href="/skyjo/login">Retour à la connexion</a>
      </div>
    </div>
  </div>
</body>
</html>
