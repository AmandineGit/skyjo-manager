{# Compteur de Qwirkles d'un tour (une pose peut compléter plusieurs lignes). Attend `value`. #}
<span class="q-counter{% if value %} active{% endif %}">
  <button type="button" onclick="qwirkleStep(this, -1)" aria-label="Un Qwirkle de moins">−</button>
  <span class="q-counter-value">⭐ <span class="q-count">{{ value }}</span> Qwirkle</span>
  <button type="button" onclick="qwirkleStep(this, 1)" aria-label="Un Qwirkle de plus">+</button>
  <input type="hidden" name="qwirkles" value="{{ value }}">
</span>
<span class="q-turn-total" data-bonus="{{ qwirkle_bonus }}"></span>
<script>
function qwirkleStep(button, delta) {
  var box = button.closest('.q-counter');
  var input = box.querySelector('input[name=qwirkles]');
  var n = Math.min(6, Math.max(0, (parseInt(input.value, 10) || 0) + delta));
  input.value = n;
  box.querySelector('.q-count').textContent = n;
  box.classList.toggle('active', n > 0);
  qwirkleTotal(box.closest('form'));
}

// Total du tour affiché en direct : points des lignes + 6 par Qwirkle (comme games/qwirkle/scoring.turn_score)
function qwirkleTotal(form) {
  var out = form.querySelector('.q-turn-total');
  var points = parseInt(form.querySelector('input[name=points]').value, 10) || 0;
  var n = parseInt(form.querySelector('input[name=qwirkles]').value, 10) || 0;
  var bonus = parseInt(out.dataset.bonus, 10) * n;
  out.textContent = bonus ? '= ' + points + ' + ' + bonus + ' = ' + (points + bonus) + ' pts' : '';
}

document.querySelectorAll('.q-counter').forEach(function (box) {
  var form = box.closest('form');
  form.querySelector('input[name=points]').addEventListener('input', function () { qwirkleTotal(form); });
  qwirkleTotal(form);
});
</script>
