<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — Skyjo</title>
  <link rel="stylesheet" href="/skyjo/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-icon">🔐</div>
      <h1>Nouveau mot de passe</h1>
      <p style="color: #666; margin-bottom: 30px;">Choisissez un nouveau mot de passe</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash-message flash-error">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="login-form">
        <div class="form-group">
          <label for="new_password">Nouveau mot de passe</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            class="login-input"
            placeholder="6 caractères minimum"
            required
            minlength="6"
            autofocus
          >
        </div>
        <div class="form-group">
          <label for="new_password_confirm">Confirmer</label>
          <input
            type="password"
            id="new_password_confirm"
            name="new_password_confirm"
            class="login-input"
            placeholder="Retapez votre mot de passe"
            required
          >
        </div>
        <button type="submit" class="button button-submit login-submit">Réinitialiser</button>
      </form>
    </div>
  </div>
</body>
</html>
