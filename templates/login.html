<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Skyjo</title>
  <link rel="stylesheet" href="/skyjo/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-icon">🎯</div>
      <h1>Skyjo Manager</h1>
      <p style="color: #666; margin-bottom: 30px;">Connectez-vous pour continuer</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash-message flash-error">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="login-input"
            placeholder="votre@email.com"
            autofocus
            required
          >
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            class="login-input"
            placeholder="Votre mot de passe"
            required
          >
        </div>
        <button type="submit" class="button button-submit login-submit">🔓 Connexion</button>
      </form>

      <div class="login-links">
        <a href="/skyjo/forgot-password">Mot de passe oublié ?</a>
        <span class="separator">·</span>
        <a href="/skyjo/register">Créer un compte</a>
      </div>
    </div>
  </div>
</body>
</html>
